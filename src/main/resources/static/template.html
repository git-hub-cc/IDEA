<!-- template.html - 应用中所有动态HTML模板的中央存储库。 -->

<!-- 设置模态框的模板 -->
<template id="settings-modal-template">
    <div class="settings-modal-body">
        <div class="modal-tabs">
            <button class="modal-tab" data-tab="app-settings-pane">主题设置</button>
            <button class="modal-tab" data-tab="ai-settings-pane">AI设置</button>
            <button class="modal-tab" data-tab="git-settings-pane">Git设置</button>
            <button class="modal-tab" data-tab="env-settings-pane">环境设置</button>
        </div>
        <div class="modal-tab-content">
            <div id="app-settings-pane" class="tab-pane">
                <!-- App settings content will be populated by JS -->
            </div>
            <div id="ai-settings-pane" class="tab-pane">
                <!-- AI settings content will be populated by JS -->
            </div>
            <div id="git-settings-pane" class="tab-pane">
                <!-- Git settings content will be populated by JS -->
            </div>
            <div id="env-settings-pane" class="tab-pane">
                <div class="settings-item">
                    <label for="settings-workspace-root">工作区根目录</label>
                    <input type="text" id="settings-workspace-root" placeholder="例如: C:/Users/YourName/web-ide-workspace">
                </div>
                <div class="settings-item">
                    <label for="settings-maven-home">Maven 主目录 (MAVEN_HOME)</label>
                    <input type="text" id="settings-maven-home" placeholder="例如: C:/tools/apache-maven-3.9.6">
                </div>
                <div class="settings-item">
                    <label>JDK 路径配置 (修改后自动保存到服务器)</label>
                    <p style="font-size: 0.8em; color: var(--text-secondary); margin-bottom: 8px;">
                        (可选) 指定本地JDK路径以覆盖后端默认的构建环境。如果留空，系统将使用内置的JDK 17进行兼容性编译。
                    </p>
                    <div id="jdk-paths-list" class="settings-list"></div>
                    <button id="add-jdk-path-btn" class="modal-action-btn secondary-btn" style="margin-top: 10px; align-self: flex-start;">
                        <i class="fas fa-plus"></i> 添加 JDK
                    </button>
                </div>
            </div>
        </div>
    </div>
</template>

<!-- 设置模态框中“应用设置”面板的模板 -->
<template id="app-settings-pane-template">
    <div class="settings-item">
        <label for="settings-theme">主题</label>
        <select id="settings-theme">
            <option value="dark-theme">深色主题 (Darcula)</option>
            <option value="light-theme">浅色主题 (Light)</option>
        </select>
    </div>
    <div class="settings-item">
        <label for="settings-font-size">编辑器字号</label>
        <input type="number" id="settings-font-size" min="10" max="24" step="1">
    </div>
    <div class="settings-item">
        <label for="settings-editor-font">编辑器字体</label>
        <input type="text" id="settings-editor-font" placeholder="例如: 'JetBrains Mono', 'Fira Code'">
    </div>
    <div class="settings-item">
        <label for="settings-word-wrap">自动换行</label>
        <select id="settings-word-wrap">
            <option value="true">开启</option>
            <option value="false">关闭</option>
        </select>
    </div>
</template>

<!-- 设置模态框中“AI设置”面板的模板 -->
<template id="ai-settings-pane-template">
    <div class="settings-item">
        <label for="settings-ai-api-endpoint">API 端点 URL</label>
        <input type="text" id="settings-ai-api-endpoint" placeholder="例如: https://api.openai.com/v1/chat/completions">
        <p style="font-size: 0.8em; color: var(--text-secondary); margin-top: 4px;">
            AI服务的HTTP API接口地址。
        </p>
    </div>
    <div class="settings-item">
        <label for="settings-ai-api-key">API 密钥</label>
        <input type="password" id="settings-ai-api-key" placeholder="在此输入您的API密钥">
        <p style="font-size: 0.8em; color: var(--text-secondary); margin-top: 4px;">
            您的密钥将安全地存储在浏览器的本地存储中，不会上传到IDE后端服务器。
        </p>
    </div>
    <div class="settings-item">
        <label for="settings-ai-model">模型名称</label>
        <input type="text" id="settings-ai-model" placeholder="例如: gpt-3.5-turbo">
        <p style="font-size: 0.8em; color: var(--text-secondary); margin-top: 4px;">
            指定要使用的AI模型。
        </p>
    </div>
</template>

<!-- 设置模态框中“Git设置”面板的模板 -->
<template id="git-settings-pane-template">
    <div class="settings-item">
        <label for="settings-git-platform">代码托管平台</label>
        <select id="settings-git-platform">
            <option value="gitee">Gitee</option>
            <option value="github">GitHub</option>
        </select>
    </div>
    <div class="settings-item">
        <label for="settings-gitee-token">访问令牌 (Access Token)</label>
        <input type="password" id="settings-gitee-token" placeholder="用于 API 访问和 HTTPS 克隆">
    </div>
    <div class="settings-item">
        <label for="settings-ssh-key-path">SSH 私钥绝对路径</label>
        <input type="text" id="settings-ssh-key-path" placeholder="例如 C:/Users/YourName/.ssh/id_ed25519">
    </div>
    <div class="settings-item">
        <label for="settings-ssh-passphrase">SSH 私钥密码</label>
        <input type="password" id="settings-ssh-passphrase" placeholder="如果私钥有密码，在此输入">
    </div>
</template>

<!-- JDK 添加/编辑提示框的模板 -->
<template id="jdk-prompt-template">
    <div class="settings-item">
        <label for="jdk-prompt-key">JDK 标识符 (例如: jdk8, jdk11, jdk17)</label>
        <input type="text" id="jdk-prompt-key">
    </div>
    <div class="settings-item">
        <label for="jdk-prompt-value">JDK 可执行文件路径 (java.exe)</label>
        <input type="text" id="jdk-prompt-value" placeholder="例如: C:/Program Files/Java/jdk-17/bin/java.exe">
    </div>
</template>

<!-- Git仓库选择模态框的模板 -->
<template id="repo-selection-modal-template">
    <div>
        <p>请从 <span class="repo-owner-name"></span> 的公开仓库中选择一个进行克隆:</p>
        <div id="repo-selection-list" style="max-height: 300px; overflow-y: auto; border: 1px solid var(--border-color); margin-top: 10px; border-radius: 4px;">
            <!-- Repo items will be populated by JS -->
        </div>
    </div>
</template>

<!-- 仓库选择列表中单个仓库项的模板 -->
<template id="repo-item-template">
    <div class="repo-item-label">
        <div class="repo-item-details">
            <strong class="repo-name"></strong>
            <p class="repo-description"></p>
        </div>
    </div>
</template>

<!-- 指令面板/列表提示框的模板 -->
<template id="list-prompt-template">
    <div class="command-palette">
        <input type="text" placeholder="搜索指令..." class="modal-search-input">
        <ul class="modal-list"></ul>
    </div>
</template>

<!-- 文件树欢迎视图的模板 -->
<template id="file-tree-welcome-template">
    <div style="padding: 20px; color: var(--text-secondary); font-size: 0.9em;">
        <p style="margin-bottom: 15px;">开始一个新项目:</p>
        <ul style="list-style-type: none; padding-left: 10px;">
            <li style="margin-bottom: 8px;"><button class="welcome-action-btn" data-action="open-folder" style="all: unset; cursor: pointer; color: var(--accent-color); text-decoration: underline;">1. 从本地目录打开项目</button></li>
            <li style="margin-bottom: 8px;"><button class="welcome-action-btn" data-action="clone-from-url" style="all: unset; cursor: pointer; color: var(--accent-color); text-decoration: underline;">2. 通过远程仓库 URL 克隆项目</button></li>
            <li style="margin-bottom: 8px;"><button class="welcome-action-btn" data-action="vcs-clone" style="all: unset; cursor: pointer; color: var(--accent-color); text-decoration: underline;">3. 选择当前用户的代码仓库进行导入</button></li>
        </ul>
    </div>
</template>

<!-- 功能引导弹出框的模板 -->
<template id="tour-popover-template">
    <h4></h4>
    <p></p>
    <div class="tour-popover-footer">
        <span class="tour-popover-steps"></span>
        <div class="tour-popover-nav">
            <!-- Navigation buttons will be populated by JS -->
        </div>
    </div>
</template>

<!-- 控制台虚拟滚动视口的模板 -->
<template id="console-viewport-template">
    <div class="console-viewport">
        <div class="console-content"></div>
    </div>
</template>

<!-- 调试器控制台虚拟滚动视口的模板 -->
<template id="debugger-console-viewport-template">
    <div class="console-toolbar debugger-console-toolbar">
        <button class="console-tool-btn active" data-action="scroll-lock" title="滚动到底部">
            <i class="fas fa-arrow-down"></i>
        </button>
        <button class="console-tool-btn" data-action="clear-console" title="清空日志">
            <i class="fas fa-trash-alt"></i>
        </button>
        <button class="console-tool-btn active" data-action="toggle-wrap" title="切换自动换行">
            <i class="fas fa-align-left"></i>
        </button>
    </div>
    <div class="console-viewport debugger-console-viewport">
        <div class="console-content debugger-console-content"></div>
    </div>
</template>

<!-- AI聊天面板的模板 -->
<template id="ai-chat-panel-template">
    <div class="panel-header">
        <h3>AI 聊天</h3>
        <button class="panel-header-btn" data-action="clear-ai-chat" title="清空对话">
            <i class="fas fa-trash-alt"></i>
        </button>
    </div>
    <div class="chat-history-container" id="ai-chat-history">
        <!-- Messages will be appended here by AiChatManager -->
        <div class="chat-message ai-message">
            <div class="message-content">
                <p>你好！有什么可以帮你的吗？可以问我关于代码的问题，或者让我帮你解释、重构代码。</p>
            </div>
        </div>
    </div>
    <form class="chat-input-form" id="ai-chat-form">
        <textarea id="ai-chat-input" placeholder="输入消息 (Shift+Enter 换行)..." rows="1"></textarea>
        <button type="submit" id="ai-chat-send-btn" title="发送消息">
            <i class="fas fa-paper-plane"></i>
        </button>
    </form>
</template>


<!-- ========================= 新增 START: Docker 面板相关模板 ========================= -->

<!-- Docker 面板主布局模板 -->
<template id="docker-panel-template">
    <div class="docker-panel-wrapper">
        <div class="docker-resource-list">
            <div class="docker-resource-header">
                <h3><i class="fab fa-docker"></i> Docker 资源</h3>
                <button class="icon-btn" data-action="docker-refresh" title="刷新列表"><i class="fas fa-sync-alt"></i></button>
            </div>
            <div class="docker-resource-body">
                <!-- 资源分类将在此处动态填充 -->
            </div>
        </div>
        <div class="docker-details-panel">
            <!-- 详情内容将在此处动态填充 -->
            <div class="docker-details-welcome">
                <i class="fab fa-docker"></i>
                <p>从左侧选择一个资源以查看详情。</p>
            </div>
        </div>
    </div>
</template>

<!-- Docker 资源分类模板 -->
<template id="docker-resource-category-template">
    <details class="docker-resource-category" open>
        <summary>
            <span class="category-name"></span>
            <span class="category-count"></span>
        </summary>
        <ul class="resource-list-ul">
            <!-- 列表项将在此填充 -->
        </ul>
    </details>
</template>

<!-- Docker 容器列表项模板 -->
<template id="docker-container-item-template">
    <li class="resource-item" tabindex="0">
        <div class="resource-item-main">
            <span class="status-indicator" title="状态"></span>
            <div class="resource-item-info">
                <strong class="resource-name"></strong>
                <span class="resource-subtext"></span>
            </div>
        </div>
        <div class="resource-item-actions">
            <!-- 快捷操作按钮 -->
        </div>
    </li>
</template>

<!-- Docker 镜像列表项模板 -->
<template id="docker-image-item-template">
    <li class="resource-item" tabindex="0">
        <div class="resource-item-main">
            <i class="fas fa-layer-group resource-icon"></i>
            <div class="resource-item-info">
                <strong class="resource-name"></strong>
                <span class="resource-subtext"></span>
            </div>
        </div>
        <div class="resource-item-actions">
            <button class="icon-btn" data-action="docker-remove-image" title="删除镜像"><i class="fas fa-trash-alt"></i></button>
        </div>
    </li>
</template>


<!-- Docker 容器详情面板模板 -->
<template id="docker-container-details-template">
    <div class="docker-details-header">
        <h4 class="details-title">
            <span class="status-indicator"></span>
            <span class="container-name"></span>
            <small class="container-id"></small>
        </h4>
        <div class="details-actions">
            <button class="modal-action-btn secondary-btn" data-action="docker-start-container"><i class="fas fa-play"></i> 启动</button>
            <button class="modal-action-btn secondary-btn" data-action="docker-stop-container"><i class="fas fa-stop"></i> 停止</button>
            <button class="modal-action-btn secondary-btn" data-action="docker-restart-container"><i class="fas fa-sync-alt"></i> 重启</button>
            <button class="modal-action-btn secondary-btn danger-btn" data-action="docker-remove-container"><i class="fas fa-trash-alt"></i> 删除</button>
        </div>
    </div>
    <div class="docker-details-content">
        <div class="modal-tabs">
            <button class="modal-tab active" data-tab="docker-overview-pane">概览</button>
            <button class="modal-tab" data-tab="docker-logs-pane">日志</button>
            <button class="modal-tab" data-tab="docker-terminal-pane">终端</button>
            <button class="modal-tab" data-tab="docker-inspect-pane">检查</button>
        </div>
        <div class="modal-tab-content">
            <div id="docker-overview-pane" class="tab-pane active"></div>
            <div id="docker-logs-pane" class="tab-pane"></div>
            <div id="docker-terminal-pane" class="tab-pane"></div>
            <div id="docker-inspect-pane" class="tab-pane"></div>
        </div>
    </div>
</template>

<!-- Docker 概览标签页模板 -->
<template id="docker-overview-pane-template">
    <div class="docker-overview-grid">
        <div class="info-card">
            <div class="info-card-header">状态</div>
            <div class="info-card-body status-text"></div>
        </div>
        <div class="info-card">
            <div class="info-card-header">镜像</div>
            <div class="info-card-body image-text"></div>
        </div>
        <div class="info-card">
            <div class="info-card-header">创建于</div>
            <div class="info-card-body created-text"></div>
        </div>
        <div class="info-card full-width">
            <div class="info-card-header">端口映射</div>
            <div class="info-card-body ports-list"></div>
        </div>
        <div class="info-card full-width">
            <div class="info-card-header">资源监控</div>
            <div class="info-card-body monitor-charts">
                <div class="chart-container"><canvas class="docker-cpu-chart"></canvas></div>
                <div class="chart-container"><canvas class="docker-mem-chart"></canvas></div>
            </div>
        </div>
    </div>
</template>

<!-- ========================= 新增 END ======================================================= -->
